<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de participação no Festival de Degustação Japonesa">

    <title>Participação - Festival de Degustação Japonesa</title>

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/formulario.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <header>
        <h1>Reserva de Participação</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#evento">Evento</a></li>
                <li><a href="index.html#programacao">Programação</a></li>
                <li><a href="index.html#cardapio">Cardápio</a></li>
                <li><a href="index.html#chefs">Chefs</a></li>
                <li><a href="index.html#local">Local</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="formulario-participacao">

            <h2>Reserve sua presença</h2>

            <p>
                Preencha o formulário abaixo para reservar sua participação
                no Festival de Degustação Japonesa.
            </p>

            <form id="formulario-participacao">

                <div class="campo-formulario">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        maxlength="11"
                        inputmode="numeric"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="quantidade">Quantidade de participantes</label>
                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="1"
                        max="4"
                        value="1"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="atividade">Atividade de interesse</label>

                    <select id="atividade" name="atividade" required>
                        <option value="">Selecione uma atividade</option>
                        <option value="sushi">Oficina de Sushi - 10h</option>
                        <option value="yakisoba">Degustação de Yakisoba - 14h</option>
                        <option value="cultura">Apresentação Cultural - 17h</option>
                        <option value="todos">Todos as atividades</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="observacoes">Observações</label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="5"
                        placeholder="Digite alguma observação, se necessário"
                    ></textarea>
                </div>

                <div class="campo-formulario">
                    <label>
                        <input
                            type="checkbox"
                            id="confirmacao"
                            name="confirmacao"
                            required
                        >
                        Confirmo minha presença no evento.
                    </label>
                </div>

                <button type="submit" class="botao-reserva">
                    Reservar participação
                </button>

            </form>

            <p id="mensagem-confirmacao"></p>

        </section>

    </main>

    <footer id="contato">

        <h2>Contato</h2>

        <p>
            E-mail: japones@gmail.com
        </p>

        <p>
            WhatsApp: (11) 98888-8888
        </p>

    </footer>

    <script src="js/participacao.js"></script>

</body>

</html>
